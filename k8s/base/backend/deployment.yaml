apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ghiseul-cetateanului
  labels:
    app: backend

spec:
  replicas: 2
  revisionHistoryLimit: 10

  selector:
    matchLabels:
      app: backend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: backend

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      initContainers:
        - name: wait-for-mariadb-galera
          image: mariadb:11.4
          imagePullPolicy: IfNotPresent

          command:
            - sh
            - -c
            - |
              until mariadb-admin ping \
                --host="$MARIADB_HOST" \
                --port="$MARIADB_PORT" \
                --user="$MARIADB_USER" \
                --password="$MARIADB_PASSWORD" \
                --silent;
              do
                echo "Astept clusterul MariaDB Galera...";
                sleep 5;
              done

              echo "MariaDB Galera este disponibila."

          env:
            - name: MARIADB_HOST
              valueFrom:
                secretKeyRef:
                  name: mariadb-galera-secret
                  key: host

            - name: MARIADB_PORT
              valueFrom:
                secretKeyRef:
                  name: mariadb-galera-secret
                  key: port

            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: mariadb-galera-secret
                  key: app-user

            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-galera-secret
                  key: app-password

      containers:
        - name: backend
          image: ghcr.io/icandoro/documentsmanager-backend:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: APP_ENV
              value: "prod"

            - name: APP_DEBUG
              value: "0"

            - name: APP_RUNTIME_OPTIONS
              value: '{"disable_dotenv":true}'

            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: documents-manager-secrets
                  key: APP_SECRET

            - name: MARIADB_HOST
              valueFrom:
                secretKeyRef:
                  name: mariadb-galera-secret
                  key: host

            - name: MARIADB_PORT
              valueFrom:
                secretKeyRef:
                  name: mariadb-galera-secret
                  key: port

            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mariadb-galera-secret
                  key: database

            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: mariadb-galera-secret
                  key: app-user

            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-galera-secret
                  key: app-password

            - name: DATABASE_URL
              value: "mysql://$(MARIADB_USER):$(MARIADB_PASSWORD)@$(MARIADB_HOST):$(MARIADB_PORT)/$(MARIADB_DATABASE)?serverVersion=mariadb-11.4.5&charset=utf8mb4"

            - name: CORS_ALLOW_ORIGIN
              value: '^https://(www\.)?ghiseulcetateanului\.ro$'

            - name: DEFAULT_URI
              value: "https://ghiseulcetateanului.ro/api"

            - name: FRONTEND_URL
              value: "https://ghiseulcetateanului.ro"

            - name: MAILER_FROM_ADDRESS
              value: "no-reply@ghiseulcetateanului.ro"

            - name: MAILER_FROM_NAME
              value: "Ghiseul Cetateanului"

            - name: MAILER_DSN
              valueFrom:
                secretKeyRef:
                  name: documents-manager-secrets
                  key: MAILER_DSN

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: "1"
              memory: 768Mi
